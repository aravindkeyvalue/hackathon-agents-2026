[project]
name = "ticketagent"
version = "0.1.0"
description = "A standalone Jira triage agent that acts only through a Jira MCP server (mcp-atlassian shape, alias-routed)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.20,<2",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ticketagent = "ticketagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticketagent"]

